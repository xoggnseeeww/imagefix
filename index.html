<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브코딩 - 고성능 이미지 리사이저</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8">
        <header class="text-center py-10">
            <h1 class="text-3xl font-bold">VibeCoding Image Resizer</h1>
            <p class="text-slate-500">서버 없이 안전하게, 기기 성능을 극한으로 사용하는 리사이저</p>
        </header>

        <main>
            <div id="dropzone" class="border-4 border-dashed border-slate-200 rounded-2xl p-12 text-center hover:border-blue-400 transition-colors cursor-pointer">
                <p>파일을 드래그하거나 클릭하여 업로드하세요</p>
            </div>
            
            <div id="progress-container" class="mt-8 hidden">
                <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
                    <div id="overall-progress" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { Support } from './js/support.js';
        window.Support = Support;
    </script>
    <script src="js/app.js"></script>
</body>
</html>

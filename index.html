<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageFix — 이미지 도구 모음</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M3 9h18M9 21V9"/>
                </svg>
                <span class="brand-name">ImageFix</span>
                <span class="brand-ver">v2.0</span>
            </div>
            <div id="global-progress" class="global-progress hidden">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
        </header>

        <nav class="tab-nav" id="tab-nav">
            <button class="tab active" data-tab="resize">⤢ 리사이징</button>
            <button class="tab" data-tab="compress">⊖ 용량 줄이기</button>
            <button class="tab" data-tab="sharpen">◈ 사진 선명화</button>
            <button class="tab" data-tab="drawing">△ 도면 선명화</button>
            <button class="tab" data-tab="scan">▤ 스캔 보정</button>
            <button class="tab" data-tab="pdf2jpg">↓ PDF→JPG</button>
            <button class="tab" data-tab="jpg2pdf">↑ JPG→PDF</button>
        </nav>

        <main id="workspace">
            <div id="drop-zone" class="drop-zone">
                <div class="drop-inner">
                    <div class="drop-icon">+</div>
                    <p id="drop-hint" class="drop-hint">파일을 드래그하거나 클릭하세요</p>
                    <p id="drop-sub" class="drop-sub">JPEG · PNG · WebP</p>
                </div>
                <input type="file" id="file-input" multiple hidden>
            </div>

            <div id="options-panel" class="options-panel"></div>

            <div id="queue-section" class="queue-section hidden">
                <div class="queue-header">
                    <span class="queue-label">대기열 <span id="queue-count" class="queue-count">0</span></span>
                    <button id="clear-btn" class="btn-ghost">전체 삭제</button>
                </div>
                <div id="queue-list" class="queue-list"></div>
                <div class="action-bar">
                    <button id="start-btn" class="btn-primary">처리 시작</button>
                    <button id="download-btn" class="btn-secondary hidden">결과 다운로드</button>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브코딩 v1.2 - Metadata & Resilience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <style>
        /* 최소한의 레이아웃 - css/app.css로 분리 권장 */
        :root { --primary: #007AFF; --bg: #ffffff; --text: #1d1d1f; }
        body.dark { --bg: #1d1d1f; --text: #f5f5f7; }
        #progress-container { width: 100%; height: 4px; background: #eee; display: none; }
        #progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>바이브코딩 v1.2</h1>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </header>

        <main>
            <section id="upload-zone" style="border: 2px dashed #ccc; padding: 40px; text-align: center; cursor: pointer;">
                <p>파일을 여기에 드래그하거나 클릭하세요.</p>
                <input type="file" id="file-input" multiple hidden>
            </section>

            <section id="batch-list" class="hidden">
                <h2>작업 대기열 (<span id="queue-count">0</span>)</h2>
                <div id="queue-items"></div>
                <button id="start-batch-btn" style="background: var(--primary); color: white; padding: 10px 20px;">일괄 리사이징 시작</button>
            </section>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
